# V90S low-overhead Flycast baseline. Users may change these values in RetroArch.
reicast_cpu_mode = "dynamic_recompiler"
reicast_enable_dsp = "disabled"
reicast_anisotropic_filtering = "1"
reicast_internal_resolution = "640x480"
reicast_threaded_rendering = "enabled"
reicast_synchronous_rendering = "disabled"
reicast_delay_frame_swapping = "disabled"
reicast_frame_skipping = "disabled"
reicast_pvr2_filtering = "disabled"
reicast_texupscale = "1"

# KNULLI/A133-proven Parallel-N64 baseline.
parallel-n64-gfxplugin = "gliden64"
parallel-n64-rspplugin = "hle"
parallel-n64-screensize = "640x480"
