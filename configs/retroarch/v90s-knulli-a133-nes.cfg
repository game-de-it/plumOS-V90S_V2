# KNULLI A133/libretro-style RetroArch config for V90S live testing.
# Derived from knulli-configgen configgen-defaults-a133.yml and
# configgen/generators/libretro. Paths are adapted for the current Debian
# payload; video_context_driver is pinned to the patched GE8300 fbdev context.
# Input is kept on SDL2 and bound explicitly from KNULLI's GPIO Controller 1
# es_input.cfg mapping because adc_gamepad has no usable autoconfig here yet.

config_save_on_exit = "false"
global_core_options = "true"

menu_driver = "ozone"
menu_scale_factor = "1.500000"
ozone_font_scale = "1"
ozone_font_scale_factor_global = "1.200000"
menu_battery_level_enable = "false"
content_show_favorites = "false"
content_show_images = "false"
content_show_music = "false"
content_show_video = "false"
content_show_history = "false"
content_show_playlists = "false"
content_show_add = "false"
menu_show_load_core = "false"
menu_show_load_content = "false"
menu_show_online_updater = "false"
menu_show_core_updater = "false"
menu_show_restart_retroarch = "false"
menu_show_load_content_animation = "false"
menu_swap_ok_cancel_buttons = "true"

libretro_directory = "/usr/lib/aarch64-linux-gnu/libretro"
libretro_info_path = "/usr/share/libretro/info"
assets_directory = "/usr/share/libretro/assets"
core_options_path = "/tmp/retroarch-core-options.cfg"
cache_directory = "/tmp/retroarch-cache"
system_directory = "/root/.config/retroarch/system"
savefile_directory = "/tmp"
savestate_directory = "/tmp"
screenshot_directory = "/tmp"
recording_output_directory = "/tmp"
extraction_directory = "/tmp"
video_filter_dir = "/usr/share/video_filters"
audio_filter_dir = "/usr/share/audio_filters"

video_driver = "gl"
video_context_driver = "mali_fbdev"
video_fullscreen = "true"
video_fullscreen_x = "640"
video_fullscreen_y = "480"
video_vsync = "true"
video_hard_sync = "false"
video_threaded = "true"
video_allow_rotate = "true"
video_rotation = "0"
video_black_frame_insertion = "false"
video_aspect_ratio_auto = "false"
video_gpu_screenshot = "true"
video_shader_enable = "false"
video_smooth = "false"
video_scale_integer = "false"
video_scale_integer_scaling = "0"
video_scale_integer_axis = "0"
aspect_ratio_index = "22"
vrr_runloop_enable = "false"
video_frame_delay_auto = "false"
video_font_enable = "true"
video_font_size = "16.000000"
video_message_pos_x = "0.05"
video_message_pos_y = "0.05"
video_viewport_bias_x = "0.5"
video_viewport_bias_y = "0.5"

audio_enable = "true"
audio_driver = "alsathread"
audio_latency = "64"
audio_volume = "0"
audio_sync = "true"

input_driver = "sdl2"
input_joypad_driver = "sdl2"
input_autodetect_enable = "false"
input_max_users = "16"
input_player1_joypad_index = "0"
input_player1_analog_dpad_mode = "0"
input_player2_analog_dpad_mode = "1"
input_player3_analog_dpad_mode = "1"
input_player4_analog_dpad_mode = "1"
input_libretro_device_p1 = "1"
input_libretro_device_p2 = "1"
input_enable_hotkey_btn = "8"
input_enable_hotkey = "shift"
input_menu_toggle = "f1"
input_exit_emulator = "escape"
input_player1_a_btn = "1"
input_player1_b_btn = "0"
input_player1_x_btn = "2"
input_player1_y_btn = "3"
input_player1_l_btn = "4"
input_player1_r_btn = "5"
input_player1_select_btn = "7"
input_player1_start_btn = "6"
input_player1_left_axis = "-0"
input_player1_right_axis = "+0"
input_player1_up_axis = "-1"
input_player1_down_axis = "+1"

pause_nonactive = "false"
rewind_enable = "false"
run_ahead_enabled = "false"
preemptive_frames_enable = "false"
run_ahead_frames = "0"
run_ahead_secondary_instance = "false"
cheevos_enable = "false"
cheevos_hardcore_mode_enable = "false"
cheevos_leaderboards_enable = "false"
cheevos_verbose_enable = "false"
cheevos_auto_screenshot = "false"
cheevos_challenge_indicators = "false"
cheevos_start_active = "false"
cheevos_richpresence_enable = "false"
cheevos_badges_enable = "true"
cheevos_unlock_sound_enable = "false"
builtin_imageviewer_enable = "false"
all_users_control_menu = "false"
notification_show_remap_load = "false"
load_dummy_on_core_shutdown = "false"
sort_savefiles_enable = "false"
sort_savestates_enable = "false"
savestate_auto_save = "false"
savestate_auto_load = "false"
savestate_auto_index = "true"
savestate_max_keep = "0"
state_slot = "0"
rgui_extended_ascii = "true"
rgui_show_start_screen = "false"
fps_show = "false"
fps_update_interval = "30"
quit_press_twice = "false"
